name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Restore geometry and face assets for offline tests
        run: git lfs pull --include="assets/robot/startouch-v3/meshes/**,apps/dummy/models/*.tflite,local/models/vision/*.onnx,local/models/vision/yolov8n.pt" --exclude=""

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install offline Python test dependencies
        run: python -m pip install -r tools/assets/requirements-test.txt

      - name: Install CPU tensors for shared-model adapter tests
        run: python -m pip install "torch==2.10.0" --index-url https://download.pytorch.org/whl/cpu

      - name: Node tests
        run: npm run test:node

      - name: Python tests
        run: npm run test:python

      - name: Dummy adapter and resource path tests
        run: python -m pytest -q apps/dummy/tests/test_direct_robot_control.py apps/dummy/tests/test_resource_paths.py apps/dummy/tests/test_yolo_person_detector.py apps/dummy/tests/test_follow_speed_limits.py apps/dummy/tests/test_robot_ws_client.py apps/dummy/tests/test_runtime_scheduler.py apps/dummy/tests/test_follow_pipeline.py apps/dummy/tests/test_person_follow_runtime.py

      - name: Source boundary audit
        run: python tools/diagnostics/audit_boundaries.py --root .
