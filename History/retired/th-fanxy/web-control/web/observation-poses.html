<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>主动观察位采集</title><link rel="stylesheet" href="/css/active-vision.css"></head>
<body><header class="topbar"><div><p class="eyebrow">THIRDHAND / COMMISSIONING</p><h1>主动观察位采集</h1></div><a href="/active-vision.html" style="color:var(--cyan)">返回工作台</a></header>
<main><section class="pipeline-card"><div class="section-title"><div><p class="eyebrow">READ ONLY CAPTURE</p><h2>现场操作</h2></div></div><p style="margin-top:14px;color:var(--soft);line-height:1.8">手动将机械臂低速移动到能覆盖桌面的五个观察位，完全停稳后点击对应按钮。本页只读取关节与末端状态，不会发送任何运动、夹爪或抓取命令。采满后仍须逐路径低速验收，路径未经验证前主动观察保持锁定。</p></section>
<section class="work-grid"><article class="targets-card"><div class="section-title"><div><p class="eyebrow">POSES</p><h2>五个必需观察位</h2></div><span id="progress" class="count">0 / 5</span></div><div id="pose-list" class="target-list"></div></article><aside class="control-stack"><article class="state-card"><div class="section-title"><div><p class="eyebrow">ROBOT STATE</p><h2>当前只读状态</h2></div></div><div id="robot-state" class="state-body">正在读取</div></article><article class="state-card blockers-card"><div class="section-title"><div><p class="eyebrow">RESULT</p><h2>操作结果</h2></div></div><div id="capture-result" class="state-body">尚未采集</div></article></aside></section></main>
<script src="/js/observation-poses.js"></script></body></html>
