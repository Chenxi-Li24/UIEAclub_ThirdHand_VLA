# Add only inside staging.uiea-thirdhand.com's HTTPS server, before location /.
# Application additionally checks exact Origin, cookie, MFA and CSRF on binding.
location = /stream/v1/control {
    proxy_pass http://127.0.0.1:3202;
    proxy_http_version 1.1;
    proxy_set_header Host staging.uiea-thirdhand.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $thirdhand_stage_media_connection;
    proxy_connect_timeout 3s;
    proxy_read_timeout 25s;
    proxy_send_timeout 5s;
    proxy_buffering off;
}
