# Inside the existing strict mTLS edge server only. Same certificate/backend map.
# Latest feedback is separate from archival uploads and command WebSocket queues.
location = /edge/v1/state {
    client_max_body_size 24000;
    proxy_pass http://$thirdhand_stage_edge_backend;
    proxy_http_version 1.1;
    proxy_set_header Host edge.uiea-thirdhand.com;
    proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
    proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;
    proxy_set_header Connection "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
    proxy_send_timeout 3s;
    proxy_buffering off;
}
