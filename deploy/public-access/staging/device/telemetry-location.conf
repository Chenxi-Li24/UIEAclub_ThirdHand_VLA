# Add only inside edge.uiea-thirdhand.com's existing strict mTLS server.
# Existing media-grant/connect locations and their limits remain intact.
location = /edge/v1/telemetry-batches {
    client_max_body_size 360k;
    proxy_pass http://$thirdhand_stage_edge_backend;
    proxy_http_version 1.1;
    proxy_set_header Host edge.uiea-thirdhand.com;
    proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
    proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
    proxy_buffering off;
}
