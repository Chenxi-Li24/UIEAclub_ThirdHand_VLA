# /etc/nginx/conf.d/thirdhand-stage-media-routing.conf (http context)
# Routing is not authorization: the stage relay additionally checks SHA-256
# certificate registration, Ed25519 proof, lifetime and current connection.
upstream thirdhand_probe_backend {
    server unix:/run/thirdhand-relay/edge.sock;
}
upstream thirdhand_stage_camera_backend {
    server unix:/run/thirdhand-stage-edge/edge.sock;
}
map $ssl_client_s_dn $thirdhand_stage_edge_backend {
    default thirdhand_probe_backend;
    "CN=thirdhand-stage-camera-20261031" thirdhand_stage_camera_backend;
}
map $http_upgrade $thirdhand_stage_media_connection {
    default upgrade;
    "" close;
}
