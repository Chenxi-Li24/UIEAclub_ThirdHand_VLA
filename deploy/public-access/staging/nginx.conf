server {
    listen 80;
    listen [::]:80;
    server_name staging.uiea-thirdhand.com;
    root /www/wwwroot/thirdhand-stage-acme;
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 308 https://staging.uiea-thirdhand.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name staging.uiea-thirdhand.com;
    ssl_certificate /www/server/panel/vhost/cert/staging.uiea-thirdhand.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/staging.uiea-thirdhand.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    error_log /var/log/nginx/thirdhand-stage.error.log warn;
    # The host has 3 Mbps public bandwidth; compress authenticated model assets.
    gzip on;
    gzip_vary on;
    gzip_comp_level 3;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/xml model/stl;
    client_max_body_size 16k;
    location = / { return 302 /login; }
    location ~ ^/(?:control|history|login|register|forgot-password|reset-password|verify-email)(?:\.html)?$ {
        include /etc/thirdhand-stage/business-upstream.inc;
    }
    location ^~ /control-assets/ { include /etc/thirdhand-stage/business-upstream.inc; }
    location ^~ /api/v1/ { include /etc/thirdhand-stage/business-upstream.inc; }
    location / { return 404; }
}
