[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uiea-thirdhand-vla"
version = "2.0.0"
description = "UIEA ThirdHand VLA — Desktop robotic arm vision-language-action system with Lumos Touch R1"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "UIEA Club"},
]
keywords = ["robotics", "computer-vision", "vla", "robot-arm", "aruco", "yolo"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
]

[project.optional-dependencies]
# ---- Core: minimum to run ArUco pick-place baseline ----
core = [
    "numpy>=1.26",
    "opencv-contrib-python>=4.9",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

# ---- Voice: local ASR + TTS + NLU ----
voice = [
    "faster-whisper>=1.0",
    "edge-tts>=6.1",
    "pyaudio>=0.2",
    "soundfile>=0.12",
    "numpy>=1.26",
]

# ---- VLA: cloud API for vision-language reasoning ----
vla = [
    "anthropic>=0.34",
    "httpx>=0.27",
    "pillow>=10.0",
]

# ---- Web: FastAPI console + WebSocket ----
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

# ---- Vision ML: YOLO-based detection (Week 2+) ----
vision-ml = [
    "ultralytics>=8.2",
    "torch>=2.0",
    "torchvision>=0.15",
]

# ---- Development: testing + linting ----
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "ruff>=0.5",
    "mypy>=1.10",
    "scipy>=1.11",
    "types-pyyaml",
]

# ---- All-in-one ----
all = [
    "uiea-thirdhand-vla[core,voice,vla,web,vision-ml]",
]

[project.scripts]
thirdhand-vla = "uiea_thirdhand_vla.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["web/"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["N803", "N806", "N818"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
implicit_optional = true
ignore_missing_imports = true
disable_error_code = ["arg-type", "attr-defined"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
