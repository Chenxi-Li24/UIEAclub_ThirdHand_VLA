schema: thirdhand.skill-manifest.v1
id: policy.act
version: 0.1.0
summary: Produce versioned action chunks from an ACT checkpoint.
risk: physical-motion
lifecycle: worker
runtime: node
operations: [plan, execute, status, cancel]
requires:
  services: [robot, vision, supervisor]
  devices: [startouch, xvisio]
  models: [policy.act]
schemas:
  input: schemas/input.json
  plan: schemas/plan.json
  result: schemas/result.json
entrypoint: src/worker.js
healthcheck: status
